[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "robopartpicker-collector"
version = "0.1.0"
description = "Policy-gated external data collector for RoboPartPicker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = [
  "defusedxml==0.7.1",
  "httpx==0.28.1",
  "jsonschema[format-nongpl]==4.26.0",
  "openpyxl==3.1.5",
  "pypdf==6.14.2",
  "PyYAML==6.0.3",
]

[project.scripts]
rpp-collector = "robopartpicker_collector.cli:main"

[dependency-groups]
dev = [
  "build==1.5.0",
  "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/robopartpicker_collector"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
